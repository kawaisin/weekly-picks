    --bg: #0d1218;
    --panel: #161d26;
    --panel-raised: #1c2530;
    --ink: #f0f3ee;
    --muted: #8b96a3;
    --accent: #c9a227;
    --accent-contrast: #17130a;
    --accent-soft: #382c10;
    --special: #4fb6e8;
    --special-contrast: #071822;
    --special-soft: #14303d;
    --line: #2a323c;
    --danger: #c4573f;
    --danger-soft: #34201a;

    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    display: flex;
    justify-content: center;
    padding: clamp(1rem, 4vw, 2.5rem) 1rem;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -20px;
    background-image: var(--stadium-bg);
    background-size: cover;
    background-position: center 35%;
    filter: blur(7px) brightness(0.62) saturate(0.9);
    transform: scale(1.08);
    z-index: -2;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% -10%, rgba(26, 36, 50, 0.2) 0%, rgba(13, 18, 24, 0.62) 55%, rgba(13, 18, 24, 0.8) 100%);
    z-index: -1;
  }

  .board {
    width: min(480px, 100%);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

    const color = info ? info.color : "#333333";
    const text = info && info.text ? info.text : "#ffffff";
    const abbr = info ? info.abbr : team.slice(0, 2).toUpperCase();
    return `<span class="team-badge" style="background:${color};color:${text}">${abbr}</span>`;
  }

  const STORAGE_KEY = "weekly-picks-v1";

  const TOTAL_WEEKS = 18;

  let copyResetTimer = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  let currentWeek = 1;

  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const opt = document.createElement("option");
    opt.value = String(w);
    opt.textContent = `Week ${w} · ${SCHEDULE[w].dates}`;
    weekSelect.appendChild(opt);
  }

  function getWeekData(week) {
    const raw = state[week];
    if (!raw) return { picks: [], special: null };
    if (Array.isArray(raw)) return { picks: raw, special: null };
    return { picks: raw.picks || [], special: raw.special || null };
  }

  function setWeekData(week, { picks, special }) {
    if (picks.length === 0) {
      delete state[week];
    } else {
      state[week] = { picks, special: special && picks.includes(special) ? special : null };
    }
    saveState();
  }

  function getOpponent(week, team) {
    for (const [away, home] of SCHEDULE[week].games) {
      if (away === team) return home;
      if (home === team) return away;
    }
    return null;
  }

  function toggleTeam(week, team) {
    const data = getWeekData(week);
    const picks = data.picks.slice();
    let special = data.special;
    const idx = picks.indexOf(team);
    if (idx !== -1) {
      picks.splice(idx, 1);
      if (special === team) special = null;
    } else if (picks.length < MAX_PICKS) {
      const opponent = getOpponent(week, team);
      if (opponent && picks.includes(opponent)) return;
      picks.push(team);
    } else {
      return;
    }
    setWeekData(week, { picks, special });
    render();
  }

  function toggleSpecial(week, team) {
    const data = getWeekData(week);
    if (!data.picks.includes(team)) return;
    const special = data.special === team ? null : team;
    setWeekData(week, { picks: data.picks, special });
    render();
  }

  const CHECK_ICON = `<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
  function lockIcon(locked, extraClass) {
    const shackle = locked
      ? '<path d="M7.5 11V7a4.5 4.5 0 0 1 9 0v4"></path>'
      : '<path d="M7.5 11V7a4.5 4.5 0 0 1 8.9-1.2"></path>';
    return `<svg class="${extraClass || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect>${shackle}</svg>`;
  }

  function buildMessage(week) {
    const { picks, special } = getWeekData(week);
    const info = SCHEDULE[week];
    const lines = picks.map((t, i) => `${i + 1}. ${t}${t === special ? " 🔒 Locked Pick" : ""}`);
    return [
      `🏈 Week ${week} Picks (${info.dates})`,
      ...lines
    ].join("\n");
  }

  function render() {
    weekSelect.value = String(currentWeek);
    prevBtn.disabled = currentWeek === 1;
    nextBtn.disabled = currentWeek === TOTAL_WEEKS;

    const info = SCHEDULE[currentWeek];
    weekDatesEl.textContent = info.dates + ", 2026";

    const { picks, special } = getWeekData(currentWeek);

    picksPanelEl.hidden = picks.length === 0;
    picksListEl.textContent = "";
    picksPanelLabelEl.textContent = "";
    picksPanelLabelEl.classList.remove("needs-special");

    if (picks.length > 0) {
      const needsSpecial = picks.length === MAX_PICKS && !special;
      picksPanelLabelEl.textContent = needsSpecial
        ? "Tap 🔒 to choose your Locked Pick"
        : "Your picks — tap 🔒 to change your Locked Pick";
      picksPanelLabelEl.classList.toggle("needs-special", needsSpecial);

      for (const team of picks) {
        const isSpecial = team === special;
        const li = document.createElement("li");
        li.className = "pick-row" + (isSpecial ? " special" : "");

        const name = document.createElement("span");
        name.className = "pick-row-name";
        name.innerHTML = `${teamBadge(team)}<span>${team}</span>`;

        const lockBtn = document.createElement("button");
        lockBtn.type = "button";
        lockBtn.className = "lock-btn" + (isSpecial ? " active" : "");
        lockBtn.setAttribute("aria-pressed", String(isSpecial));
        lockBtn.setAttribute("aria-label", isSpecial ? `Remove ${team} as Locked Pick` : `Set ${team} as Locked Pick`);
        lockBtn.innerHTML = lockIcon(isSpecial);
        lockBtn.addEventListener("click", () => toggleSpecial(currentWeek, team));

        li.append(name, lockBtn);
        picksListEl.appendChild(li);
      }
    }

    matchupsEl.textContent = "";
    for (const game of info.games) {
      const [away, home, loc] = game;

      const li = document.createElement("li");
      li.className = "game";

      if (loc) {
        const locEl = document.createElement("span");
        locEl.className = "game-loc";
        locEl.textContent = loc;
        li.appendChild(locEl);
      }

      const row = document.createElement("div");
      row.className = "game-row";

      function makeTeamBtn(team, opponent) {
        const btn = document.createElement("button");
        btn.type = "button";
        const isSelected = picks.includes(team);
        const isSpecial = team === special;
        btn.className = "team-btn" + (isSelected ? " selected" : "") + (isSpecial ? " special" : "");
        btn.disabled = !isSelected && (picks.length >= MAX_PICKS || picks.includes(opponent));
        const icon = isSpecial ? lockIcon(true, "mark") : CHECK_ICON;
        btn.innerHTML = `${icon}${teamBadge(team)}<span>${team}</span>`;
        btn.setAttribute("aria-pressed", String(isSelected));
        btn.addEventListener("click", () => toggleTeam(currentWeek, team));
        return btn;
      }

      const awayBtn = makeTeamBtn(away, home);
      const sep = document.createElement("span");
      sep.className = "at-sep";
      sep.textContent = loc ? "vs" : "@";
      const homeBtn = makeTeamBtn(home, away);

      row.append(awayBtn, sep, homeBtn);
      li.appendChild(row);
      matchupsEl.appendChild(li);
    }

    tallyCountEl.textContent = String(picks.length);
    copyBtn.disabled = picks.length === 0;
  }

  function goToWeek(week) {
    currentWeek = week;
    setWeekData(currentWeek, { picks: [], special: null });
    render();
  }

  weekSelect.addEventListener("change", () => {
    goToWeek(Number(weekSelect.value));
  });

  prevBtn.addEventListener("click", () => {
    if (currentWeek > 1) goToWeek(currentWeek - 1);
  });

  nextBtn.addEventListener("click", () => {
    if (currentWeek < TOTAL_WEEKS) goToWeek(currentWeek + 1);
  });

  clearBtn.addEventListener("click", () => {
    setWeekData(currentWeek, { picks: [], special: null });
    render();
  });

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch {
        return false;
      }
    }
  }

  copyBtn.addEventListener("click", async () => {
    if (copyBtn.disabled) return;
    const ok = await copyText(buildMessage(currentWeek));
    clearTimeout(copyResetTimer);
    copyBtnLabel.textContent = ok ? "Copied ✓" : "Couldn't copy";
    copyResetTimer = setTimeout(() => { copyBtnLabel.textContent = "Copy picks"; }, 1500);
  });

  render();
</script>
</body>
</html>
